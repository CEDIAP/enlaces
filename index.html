<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEDIAP | Enlaces</title>
<meta name="description" content="CEDIAP — Centro de atención infantil en Guayaquil. Escríbenos por WhatsApp, conoce nuestros servicios y síguenos en Instagram.">
<meta property="og:title" content="CEDIAP | Enlaces">
<meta property="og:description" content="Escríbenos por WhatsApp, conoce nuestros servicios y síguenos en Instagram.">
<meta name="theme-color" content="#62c6dd">
<link rel="icon" href="logo.png">
<meta property="og:image" content="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Colores tomados del logo de CEDIAP */
    --celeste:#62c6dd; --amarillo:#fcd37c; --verde:#c5e286; --lila:#c29ad8;
    --brand:#13809e;      /* celeste oscurecido para que el texto blanco se lea bien */
    --brand-2:#fcd37c;
    --bg:#f7fbfd;
    --card:#ffffff;
    --text:#3f3f46;       /* gris del texto del logo */
    --muted:#6b6b75;
    --line:#e4eef2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    background-image:
      radial-gradient(circle at 0% 0%, #dff4fa 0, transparent 40%),
      radial-gradient(circle at 100% 25%, #fdf1d6 0, transparent 35%),
      radial-gradient(circle at 0% 75%, #f1e8f8 0, transparent 35%),
      radial-gradient(circle at 100% 100%, #eef7dc 0, transparent 35%);

  }
  main{max-width:480px;margin:0 auto;padding:40px 20px 32px}
  header{text-align:center;margin-bottom:28px}
  .logo{
    width:132px;height:132px;border-radius:50%;margin:0 auto 14px;
    background:#fff;display:grid;place-items:center;
    box-shadow:0 8px 24px rgba(98,198,221,.35);overflow:hidden;
  }
  .logo img{width:100%;height:100%;object-fit:cover}
  h1{font-size:24px;font-weight:800}
  .tagline{color:var(--muted);font-size:15px;margin-top:6px;line-height:1.4}
  .section-title:first-child{margin-top:0}
  .section-title{
    font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.8px;margin:26px 4px 10px;
  }
  .links{display:flex;flex-direction:column;gap:12px}
  a.btn{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;min-height:60px;font-weight:700;font-size:16px;
    box-shadow:0 2px 6px rgba(0,0,0,.04);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.08);border-color:var(--brand)}
  a.btn:active{transform:translateY(0)}
  a.btn:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
  a.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  a.btn.primary .ico{background:rgba(255,255,255,.18);color:#fff}
  a.btn.primary small{color:rgba(255,255,255,.85)}
  .ico{
    flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:var(--ico-bg,#e3f5fa);color:var(--ico-fg,var(--brand));
  }
  .c-celeste{--ico-bg:#e3f5fa;--ico-fg:#13809e}
  .c-amarillo{--ico-bg:#fef3d8;--ico-fg:#b07a06}
  .c-verde{--ico-bg:#eef7dc;--ico-fg:#5b8a1c}
  .c-lila{--ico-bg:#f3eaf9;--ico-fg:#8250a8}
  a.btn.c-amarillo:hover{border-color:var(--amarillo)}
  a.btn.c-verde:hover{border-color:var(--verde)}
  a.btn.c-lila:hover{border-color:var(--lila)}
  a.btn.c-celeste:hover{border-color:var(--celeste)}
  .franja{display:flex;height:6px;border-radius:6px;overflow:hidden;width:120px;margin:14px auto 0}
  .franja span{flex:1}
  .ico svg{width:22px;height:22px}
  .txt{display:flex;flex-direction:column;line-height:1.25;flex:1}
  .txt small{font-weight:600;font-size:13px;color:var(--muted);margin-top:2px}
  .arrow{opacity:.45;font-size:20px}
  .info{
    margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;font-size:15px;line-height:1.5;color:var(--muted);text-align:center;
  }
  .info strong{color:var(--text)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo"><img src="logo.png" alt="Logo de CEDIAP"></div>
    <h1 id="nombre">CEDIAP</h1>
    <p class="tagline" id="lema">Centro de atención infantil · Guayaquil</p>
    <div class="franja" aria-hidden="true"><span style="background:#fcd37c"></span><span style="background:#62c6dd"></span><span style="background:#c5e286"></span><span style="background:#c29ad8"></span></div>
  </header>

  <div id="contenido"></div>

  <div class="info" id="horario"></div>

  <footer>© <span id="anio"></span> CEDIAP</footer>
</main>

<script>
/* =========================================================
   CONFIGURACIÓN — aquí se cambian los textos y enlaces.
   ========================================================= */
/* Números de WhatsApp: código de país 593 + número sin el 0 inicial, sin espacios */
const NUM_MAITE    = "593995909701";   // Maite
const NUM_LENGUAJE = "593987413342";   // Terapia de Lenguaje

const CONFIG = {
  nombre: "CEDIAP",
  lema: "Centro de atención infantil · Guayaquil",
  horario: "Atención: <strong>lunes a viernes, 10:00 a 19:00</strong>",

  secciones: [
    {
      titulo: "¿En qué podemos ayudarte?",
      enlaces: [
        { texto: "Refuerzo y Nivelación Escolar", detalle: "Pide información por WhatsApp",
          url: wa(NUM_MAITE, "Hola 👋 Vengo del Instagram de CEDIAP y me gustaría recibir información sobre *Refuerzo y Nivelación Escolar* para mi hijo/a."), icono: "libro", color: "amarillo" },
        { texto: "Psicopedagogía", detalle: "Pide información por WhatsApp",
          url: wa(NUM_MAITE, "Hola 👋 Vengo del Instagram de CEDIAP y me gustaría recibir información sobre *Psicopedagogía* para mi hijo/a."), icono: "pieza", color: "verde" },
        { texto: "Psicología Infantil", detalle: "Pide información por WhatsApp",
          url: wa(NUM_MAITE, "Hola 👋 Vengo del Instagram de CEDIAP y me gustaría recibir información sobre *Psicología Infantil* para mi hijo/a."), icono: "corazon", color: "lila" },
        { texto: "Evaluaciones Integrales", detalle: "Pide información por WhatsApp",
          url: wa(NUM_MAITE, "Hola 👋 Vengo del Instagram de CEDIAP y me gustaría recibir información sobre *Evaluaciones Integrales* para mi hijo/a."), icono: "lista", color: "celeste" },
        { texto: "Terapia de Lenguaje", detalle: "Pide información por WhatsApp",
          url: wa(NUM_LENGUAJE, "Hola 👋 Vengo del Instagram de CEDIAP y me gustaría recibir información sobre *Terapia de Lenguaje* para mi hijo/a."), icono: "chat", color: "amarillo" },
      ]
    },
    {
      titulo: "Síguenos y visítanos",
      enlaces: [
        { texto: "Síguenos en Instagram", detalle: "@cediap_ec",
          url: "https://www.instagram.com/cediap_ec/", icono: "instagram", color: "lila" },
        { texto: "Cómo llegar", detalle: "Abrir en Google Maps",
          url: "https://maps.app.goo.gl/jtsjgMeBaXTj18oK8", icono: "mapa", color: "celeste" },
      ]
    }
  ]
};

/* ========================================================= */
function wa(numero, mensaje){ return "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje); }

const ICONOS = {
  whatsapp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  libro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  pieza:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M10 3h4v3a2 2 0 1 0 4 0V3h3v7h-3a2 2 0 1 0 0 4h3v7h-7v-3a2 2 0 1 0-4 0v3H3v-7h3a2 2 0 1 0 0-4H3V3h7Z"/></svg>',
  corazon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11Z"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12Z"/><path d="M8 11h.01M12 11h.01M16 11h.01" stroke-linecap="round" stroke-width="3"/></svg>',
  mapa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  lista:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 2h6v4H9z"/><path d="m9 13 2 2 4-4"/></svg>',
  enlace:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>'
};

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

document.getElementById("nombre").textContent = CONFIG.nombre;
document.getElementById("lema").textContent = CONFIG.lema;
document.getElementById("horario").innerHTML = CONFIG.horario;
document.getElementById("anio").textContent = new Date().getFullYear();

const cont = document.getElementById("contenido");
CONFIG.secciones.forEach(sec => {
  if (sec.titulo){
    const h = document.createElement("h2");
    h.className = "section-title"; h.textContent = sec.titulo; cont.appendChild(h);
  }
  const lista = document.createElement("div"); lista.className = "links";
  sec.enlaces.forEach(e => {
    const a = document.createElement("a");
    a.className = "btn" + (e.destacado ? " primary" : "") + (e.color ? " c-" + e.color : "");
    a.href = e.url; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML =
      '<span class="ico">' + (ICONOS[e.icono] || ICONOS.enlace) + '</span>' +
      '<span class="txt">' + esc(e.texto) + (e.detalle ? '<small>' + esc(e.detalle) + '</small>' : '') + '</span>' +
      '<span class="arrow" aria-hidden="true">›</span>';
    lista.appendChild(a);
  });
  cont.appendChild(lista);
});
</script>
</body>
</html>
